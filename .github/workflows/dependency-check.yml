name: Dependency check

on:
  push:
    branches: [master, security/refresh-dependencies]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 19 * * 1'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BUNDLE_FROZEN: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: '3.3'
      - name: Install dependencies
        run: bundle install
      - name: Check known vulnerabilities
        run: |
          gem install bundler-audit --version 0.9.3 --no-document
          bundle-audit check --update
      - name: Build the site
        run: bundle exec jekyll build --strict_front_matter
